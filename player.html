<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strombild player</title>
<!--
  Strombild embeddable player. Made to live in an <iframe>. It mounts the SAME
  renderer as index.html (strombild-render.js) but with trimmed chrome, and it
  loads its model from a URL it FETCHES — never an inlined source — so a model
  can be updated as a standalone .strombild asset without redeploying this page.

    player.html?model=<relative-url-to-.strombild>[&play][&pathway=NAME][&editor=0][&speed=5]

  e.g.  <iframe src="diagrams/strombild/player.html?model=cafe.strombild&play"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f7f2e6; --paper-deep:#efe7d3; --ink:#22304a; --ink-soft:rgba(34,48,74,0.55);
    --ink-faint:rgba(34,48,74,0.18); --vermilion:#c8451f; --teal:#1f7a6d; --water:#3d7fa6; --gold:#b98a1d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg,  transparent 0 23px, rgba(34,48,74,0.045) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(34,48,74,0.045) 23px 24px);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    padding: 12px;
    display: flex; flex-direction: column; gap: 9px;
    overflow: hidden;
  }

  .deck { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: none; }
  .deck .spacer { flex: 1; }
  button, select {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 13px;
    border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink); transition: transform 60ms ease, box-shadow 60ms ease; user-select: none;
  }
  button:hover, select:hover { background: var(--paper-deep); }
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  button.primary { background: var(--teal); border-color: var(--teal); color: var(--paper); }
  button.primary:hover { background: #1a665b; }
  button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  select { box-shadow: 2px 2px 0 var(--ink); -webkit-appearance: none; appearance: none; padding-right: 26px;
           background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
           background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .speed { display: flex; flex-direction: column; gap: 2px; min-width: 110px; }
  .speed label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; }
  .speed label output { color: var(--water); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: ew-resize; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--water); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--ink); }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--water); }

  /* two-pane: canvas (dominant) + editor */
  .workspace { flex: 1; display: grid; grid-template-columns: 9fr 7fr; gap: 12px; min-height: 0; }
  .workspace.no-editor { grid-template-columns: 1fr; }
  .workspace.no-editor .col-src { display: none; }
  .col { display: flex; flex-direction: column; gap: 7px; min-height: 0; min-width: 0; }

  .stage-wrap {
    flex: 1; position: relative; border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(34,48,74,0.18); background-color: #fbf8ef;
    background-image:
      repeating-linear-gradient(0deg,  transparent 0 23px, rgba(34,48,74,0.05) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(34,48,74,0.05) 23px 24px);
    min-height: 220px; overflow: hidden;
  }
  #stage { display: block; width: 100%; height: 100%; }
  #stage.seedable { cursor: ns-resize; }

  .panel-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft); flex: none; }
  #editor {
    flex: 1; min-height: 260px; width: 100%; resize: none; background: #fbf8ef;
    border: 2px solid var(--ink); box-shadow: 3px 3px 0 rgba(34,48,74,0.18); color: var(--ink);
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.5; padding: 10px 12px; tab-size: 2;
  }
  #editor:focus { outline: none; border-color: var(--water); }
  #report {
    flex: none; max-height: 96px; overflow-y: auto; background: #fbf8ef; border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(34,48,74,0.18); padding: 7px 10px; font-size: 11px; line-height: 1.45;
  }
  #report:empty { display: none; }
  #report .row { display: flex; gap: 8px; align-items: baseline; }
  #report .tag { flex: none; width: 52px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; }
  #report .ok .tag { color: var(--teal); }
  #report .warn .tag { color: var(--gold); }
  #report .err .tag, #report .err { color: var(--vermilion); }
  #report .ln { color: var(--ink-soft); }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .workspace { grid-template-columns: 1fr; }   /* stack: canvas over a full-height editor */
    .stage-wrap { min-height: 260px; }
  }
</style>
</head>
<body>

<div class="deck">
  <button id="runBtn" class="primary">▶ Run</button>
  <button id="stepBtn">Step</button>
  <button id="resetBtn">Reset</button>
  <select id="pathwaySel" title="active pathway"></select>
  <div class="spacer"></div>
  <div class="speed">
    <label for="speed">speed <output id="speedOut">5×</output></label>
    <input type="range" id="speed" min="0.5" max="20" step="0.5" value="5">
  </div>
</div>

<div class="workspace" id="workspace">
  <div class="col">
    <div class="stage-wrap"><canvas id="stage"></canvas></div>
  </div>
  <div class="col col-src">
    <div class="panel-label">source — edit and it re-runs</div>
    <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
    <div id="report"></div>
  </div>
</div>

<script src="strombild.js"></script>
<script src="strombild-render.js"></script>
<script>
"use strict";
(() => {
const byId = id => document.getElementById(id);
const q = new URLSearchParams(location.search);

if (q.get("editor") === "0") byId("workspace").classList.add("no-editor");

const app = Strombild.createApp({
  canvas: byId("stage"), editor: byId("editor"), report: byId("report"),
  runBtn: byId("runBtn"), stepBtn: byId("stepBtn"), resetBtn: byId("resetBtn"),
  pathwaySel: byId("pathwaySel"), speed: byId("speed"), speedOut: byId("speedOut"),
});

if (q.get("speed")) app.setSpeed(parseFloat(q.get("speed")));

// bare filenames resolve to the examples/ folder; explicit paths pass through
const modelPath = f => f && !f.includes("/") ? "examples/" + f : f;
const modelUrl = q.get("model");
if (!modelUrl) {
  byId("editor").value = "# no model given.\n# usage: player.html?model=<file.strombild>";
  app.rebuild();
} else {
  fetch(modelPath(modelUrl))
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(text => {
      app.load(text);
      if (q.get("pathway")) app.setPathway(q.get("pathway"));
      if (q.has("play")) app.setRunning(true);
    })
    .catch(err => {
      byId("editor").value = "# could not load model: " + modelUrl + "\n# " + err.message;
      app.rebuild();
    });
}
})();
</script>
</body>
</html>
